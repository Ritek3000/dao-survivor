<!doctype html>
<html lang="de">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Modell-Prüfer</title>
    <style>
      html,
      body {
        margin: 0;
        height: 100%;
        overflow: hidden;
        background: #0b0a09;
        color: #c9c1b1;
        font: 14px/1.45 Georgia, 'Times New Roman', serif;
      }
      #view {
        display: block;
        width: 100%;
        height: 100%;
      }
      #panel {
        position: fixed;
        top: 0;
        left: 0;
        bottom: 0;
        width: min(340px, 44vw);
        padding: 14px 16px;
        overflow-x: hidden;
        overflow-y: auto;
        overflow-wrap: anywhere;
        box-sizing: border-box;
        background: rgba(8, 7, 6, 0.86);
        border-right: 1px solid rgba(201, 193, 177, 0.2);
      }
      h1 {
        margin: 0 0 6px;
        font-size: 19px;
        font-weight: normal;
        letter-spacing: 0.08em;
      }
      h2 {
        margin: 16px 0 6px;
        font-size: 12px;
        font-weight: normal;
        letter-spacing: 0.14em;
        text-transform: uppercase;
        color: #8f887a;
      }
      p {
        margin: 0 0 8px;
        color: #8f887a;
      }
      table {
        width: 100%;
        border-collapse: collapse;
      }
      td {
        padding: 2px 0;
        vertical-align: top;
      }
      td:last-child {
        text-align: right;
        font-family: ui-monospace, Consolas, monospace;
        font-size: 12.5px;
      }
      ul {
        margin: 0;
        padding-left: 18px;
      }
      li {
        margin-bottom: 5px;
      }
      li.bad {
        color: #e08a72;
      }
      li.warn {
        color: #e0c172;
      }
      li.good {
        color: #9bc08a;
      }
      button {
        margin: 0 5px 5px 0;
        padding: 4px 9px;
        background: rgba(0, 0, 0, 0.5);
        border: 1px solid rgba(201, 193, 177, 0.25);
        color: inherit;
        font: inherit;
        font-size: 13px;
        cursor: pointer;
      }
      button.active {
        border-color: #ffb45e;
        color: #ffb45e;
      }
    </style>
  </head>
  <body>
    <canvas id="view"></canvas>
    <aside id="panel">
      <h1>Modell-Prüfer</h1>
      <p id="hint">Eine GLB-Datei auf diese Seite ziehen, oder ?datei=name.glb an die Adresse hängen.</p>
      <div id="report"></div>
      <h2>Ansicht</h2>
      <div id="views"></div>
      <h2>Animationen</h2>
      <div id="clips"></div>
    </aside>
    <script type="module" src="/src/tools/modelCheck.ts"></script>
  </body>
</html>
